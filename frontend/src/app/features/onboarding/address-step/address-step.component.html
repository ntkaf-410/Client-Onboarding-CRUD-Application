<form [formGroup]="form" (ngSubmit)="next()" novalidate>
  <app-address-fields
    legend="Residential address"
    [group]="form.controls.residential"
    [countries]="countries()"
    [showStatus]="true"
  />

  <mat-checkbox class="same" formControlName="samePostal">
    Postal address same as residential
  </mat-checkbox>

  @if (!samePostal()) {
    <app-address-fields
      legend="Postal address (optional)"
      [group]="form.controls.postal"
      [countries]="countries()"
    />
  }

  <div class="actions">
    <button mat-stroked-button type="button" [disabled]="saving()" (click)="back()">Back</button>
    <button mat-flat-button type="submit" [disabled]="saving() || !store.onboarding()">
      @if (saving()) {
        <mat-progress-spinner mode="indeterminate" diameter="18" />
      }
      Next
    </button>
  </div>
</form>
